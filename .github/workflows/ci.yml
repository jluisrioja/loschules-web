name: CI

on:
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint
      # Genera next-env.d.ts y los tipos de rutas (no están versionados) antes de tsc.
      - run: npx next typegen
      - run: npx tsc --noEmit
